<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="star.svg" alt="" class="mark" />
    <span class="wordmark">favorite</span>
  </header>

  <!-- not connected yet -->
  <section id="connect" hidden>
    <div class="card intro">
      <p class="lead">Save anything you find, in one click.</p>
      <p class="sub">Connect the extension to your Favorite account to start.</p>
      <button id="connect-btn" class="primary wide">Connect</button>
    </div>
  </section>

  <!-- nothing savable on this tab -->
  <section id="nopage" hidden>
    <div class="card intro">
      <p class="sub">Nothing to save on this page.</p>
    </div>
  </section>

  <!-- the page, one-click favorite, and your lists -->
  <section id="form" hidden>
    <div class="card page">
      <div class="thumb" id="thumb"></div>
      <div class="meta">
        <input id="title" type="text" spellcheck="false" aria-label="Title" />
        <div class="site" id="site"></div>
      </div>
    </div>

    <div class="fav">
      <button id="fav" class="primary wide">
        <img src="star.svg" alt="" class="btn-mark" />
        <span id="fav-label">Favorite</span>
      </button>
      <button id="thought-toggle" type="button" class="link">Add a thought</button>
      <textarea id="thought" rows="2" hidden placeholder="Why it&rsquo;s a favorite (optional)"></textarea>
    </div>

    <div class="card lists">
      <p class="label">Save to a list</p>
      <ul id="lists" class="rows"></ul>
      <form id="new" class="new">
        <input id="new-title" type="text" placeholder="New list" maxlength="80" aria-label="New list name" />
        <button type="submit" class="quiet">Create</button>
      </form>
    </div>
    <p id="status" role="status"></p>
  </section>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
